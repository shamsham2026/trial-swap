    function setIdealFilter(filter) {
      currentIdealFilter = filter;
      ['all', '2way', '3way', '4way'].forEach(f => {
        const btn = document.getElementById(`ideal-filter-${f}`);
        if (!btn) return;
        if (f === filter) {
          btn.className = 'px-2 py-0.5 rounded-lg font-bold bg-indigo-600 text-white shadow-2xs';
        } else {
          btn.className = 'px-2 py-0.5 rounded-lg font-semibold bg-white border border-slate-200 text-slate-600 hover:text-slate-900';
        }
      });
      displayFilteredIdealRecommendations();
    }

    /* Helper: Verify teacher availability for a movement */
    function isTeacherFreeAt(teachers, day, period, excludeLessonId) {
      for (const t of teachers) {
        const conflict = currentTimetable.find(r => 
          r.day === day && 
          r.period === period && 
          r.teachers && r.teachers.includes(t) && 
          r.id !== excludeLessonId
        );
        if (conflict) return false;
      }
      return true;
    }

    /* Render Ideal Recommendations with 2-Way, 3-Way & 4-Way Circular Algorithms */
    function renderIdealRecommendations() {
      const container = document.getElementById('ideal-recommendations-list');
      const srcId = document.getElementById('quick-src-slot').value;
      const srcDate = document.getElementById('quick-src-date').value;
      const srcDay = getWeekdayFromDate(srcDate);

      if (!srcId) {
        container.innerHTML = `
          <div class="p-6 text-center text-slate-400 text-xs bg-white rounded-xl border border-slate-200 space-y-1">
            <i class="ph ph-sparkle text-2xl text-amber-400 block mx-auto mb-1"></i>
            <p class="font-bold text-slate-600">請先在左側選定調出日期與課節</p>
            <p class="text-[11px]">系統將自動分析同班科任，依「同日優先」、「雙師零撞堂」、「體育/電腦場地限制」為您推算 2方/3方/4方 最佳互調路徑。</p>
          </div>
        `;
        return;
      }

      const L1 = currentTimetable.find(r => r.id === srcId);
      if (!L1) return;

      const candidates = [];
      const T1 = L1.teachers || [L1.teacher];

      // Pool of other lessons in the same class (excluding duties, self, and locked lessons)
      const sameClassLessons = currentTimetable.filter(r => 
        r.className === L1.className && 
        !r.isDuty && 
        r.id !== L1.id && 
        !r.isLocked
      );

      // ==========================================
      // 1. DIRECT 2-WAY SWAP SEARCH (L1 <-> L2)
      // ==========================================
      sameClassLessons.forEach(L2 => {
        const T2 = L2.teachers || [L2.teacher];
        const sameDay = (L2.day === srcDay);

        // Teacher availability check
        const t1FreeAtL2 = isTeacherFreeAt(T1, L2.day, L2.period, L1.id);
        const t2FreeAtL1 = isTeacherFreeAt(T2, L1.day, L1.period, L2.id);

        if (!t1FreeAtL2 || !t2FreeAtL1) return;

        // Venue capacity check
        const v1 = checkVenueCapacityConflict(L2.day, L2.period, L1.subject, [L2.id]);
        const v2 = checkVenueCapacityConflict(L1.day, L1.period, L2.subject, [L1.id]);
        if (v1.conflict || v2.conflict) return;

        let score = sameDay ? 100 : 70;
        if (L1.isDouble && L2.isDouble) score += 20;

        candidates.push({
          type: '2way',
          typeLabel: '雙方直接對調',
          typeBadge: 'bg-indigo-100 text-indigo-900 border-indigo-200',
          score: score,
          lessons: [L1, L2],
          cycleDescription: [
            `【步驟 1】${T1.join('+')} (${L1.subject}) ➔ 移至 ${L2.day} ${getSlotCleanTitle(L2.period)}`,
            `【步驟 2】${T2.join('+')} (${L2.subject}) ➔ 換回 ${L1.day} ${getSlotCleanTitle(L1.period)}`
          ],
          venueNotice: '場地核驗通過 (體育≤2, 電腦≤1)',
          notes: [sameDay ? '同日對調 (免換書)' : `跨日 (${L2.day})`, L1.isDouble ? '雙教節成對' : '單節']
        });
      });

      // ==========================================
      // 2. AUTOMATIC 3-WAY CYCLE SWAP (L1 -> L2 -> L3 -> L1)
      // ==========================================
      for (let i = 0; i < sameClassLessons.length; i++) {
        const L2 = sameClassLessons[i];
        const T2 = L2.teachers || [L2.teacher];

        // L1 moves to L2's slot
        if (!isTeacherFreeAt(T1, L2.day, L2.period, L1.id)) continue;
        if (checkVenueCapacityConflict(L2.day, L2.period, L1.subject, [L2.id]).conflict) continue;

        for (let j = 0; j < sameClassLessons.length; j++) {
          if (i === j) continue;
          const L3 = sameClassLessons[j];
          const T3 = L3.teachers || [L3.teacher];

          // L2 moves to L3's slot
          if (!isTeacherFreeAt(T2, L3.day, L3.period, L2.id)) continue;
          if (checkVenueCapacityConflict(L3.day, L3.period, L2.subject, [L3.id]).conflict) continue;

          // L3 moves to L1's slot
          if (!isTeacherFreeAt(T3, L1.day, L1.period, L3.id)) continue;
          if (checkVenueCapacityConflict(L1.day, L1.period, L3.subject, [L1.id]).conflict) continue;

          let score = 85;
          if (L2.day === srcDay && L3.day === srcDay) score += 30; // All in same day!

          candidates.push({
            type: '3way',
            typeLabel: '三方環狀互調',
            typeBadge: 'bg-emerald-100 text-emerald-900 border-emerald-300',
            score: score,
            lessons: [L1, L2, L3],
            cycleDescription: [
              `【環節 1】${T1.join('+')} (${L1.subject}) ➔ 移至 ${L2.day} ${getSlotCleanTitle(L2.period)}`,
              `【環節 2】${T2.join('+')} (${L2.subject}) ➔ 移至 ${L3.day} ${getSlotCleanTitle(L3.period)}`,
              `【環節 3】${T3.join('+')} (${L3.subject}) ➔ 移至 ${L1.day} ${getSlotCleanTitle(L1.period)}`
            ],
            venueNotice: '場地核驗通過 (體育≤2, 電腦≤1)',
            notes: ['三方無撞堂輪轉', '兼顧體育與電腦上限']
          });
        }
      }

      // ==========================================
      // 3. AUTOMATIC 4-WAY CYCLE SWAP (L1 -> L2 -> L3 -> L4 -> L1)
      // ==========================================
      if (candidates.length < 5) { // Run 4-way search if more options are helpful
        for (let i = 0; i < Math.min(sameClassLessons.length, 6); i++) {
          const L2 = sameClassLessons[i];
          const T2 = L2.teachers || [L2.teacher];
          if (!isTeacherFreeAt(T1, L2.day, L2.period, L1.id)) continue;

          for (let j = 0; j < Math.min(sameClassLessons.length, 6); j++) {
            if (i === j) continue;
            const L3 = sameClassLessons[j];
            const T3 = L3.teachers || [L3.teacher];
            if (!isTeacherFreeAt(T2, L3.day, L3.period, L2.id)) continue;

            for (let k = 0; k < Math.min(sameClassLessons.length, 6); k++) {
              if (k === i || k === j) continue;
              const L4 = sameClassLessons[k];
              const T4 = L4.teachers || [L4.teacher];

              if (!isTeacherFreeAt(T3, L4.day, L4.period, L3.id)) continue;
              if (!isTeacherFreeAt(T4, L1.day, L1.period, L4.id)) continue;

              // Check venue capacity for all 4 moves
              if (checkVenueCapacityConflict(L2.day, L2.period, L1.subject, [L2.id]).conflict) continue;
              if (checkVenueCapacityConflict(L3.day, L3.period, L2.subject, [L3.id]).conflict) continue;
              if (checkVenueCapacityConflict(L4.day, L4.period, L3.subject, [L4.id]).conflict) continue;
              if (checkVenueCapacityConflict(L1.day, L1.period, L4.subject, [L1.id]).conflict) continue;

              candidates.push({
                type: '4way',
                typeLabel: '四方環狀互調',
                typeBadge: 'bg-purple-100 text-purple-900 border-purple-300',
                score: 75,
                lessons: [L1, L2, L3, L4],
                cycleDescription: [
                  `【環節 1】${T1.join('+')} (${L1.subject}) ➔ 移至 ${L2.day} ${getSlotCleanTitle(L2.period)}`,
                  `【環節 2】${T2.join('+')} (${L2.subject}) ➔ 移至 ${L3.day} ${getSlotCleanTitle(L3.period)}`,
                  `【環節 3】${T3.join('+')} (${L3.subject}) ➔ 移至 ${L4.day} ${getSlotCleanTitle(L4.period)}`,
                  `【環節 4】${T4.join('+')} (${L4.subject}) ➔ 移至 ${L1.day} ${getSlotCleanTitle(L1.period)}`
                ],
                venueNotice: '場地核驗通過 (體育≤2, 電腦≤1)',
                notes: ['四方全域閉環連動', '零撞堂高難度解方']
              });
              if (candidates.filter(c => c.type === '4way').length >= 3) break;
            }
            if (candidates.filter(c => c.type === '4way').length >= 3) break;
          }
          if (candidates.filter(c => c.type === '4way').length >= 3) break;
        }
      }

      candidates.sort((a, b) => b.score - a.score);
      cachedIdealCandidates = candidates;
      displayFilteredIdealRecommendations();
    }

    /* Execute Circular Multi-Way Swaps (2-Way, 3-Way or 4-Way) */
    function executeMultiWayCycleSwap(lessonIds, typeLabel) {
      const lessons = lessonIds.map(id => currentTimetable.find(r => r.id === id));
      if (lessons.some(l => !l)) return;

      const recordId = 'CYCLE_' + Date.now();
      const movements = [];
      const len = lessons.length;
      const originalSlots = lessons.map(l => ({ day: l.day, period: l.period }));

      // Shift positions circularly: L[i] moves to L[(i+1)%len]'s slot
      for (let i = 0; i < len; i++) {
        const nextIdx = (i + 1) % len;
        const targetSlot = originalSlots[nextIdx];

        movements.push({
          lessonId: lessons[i].id,
          teacher: lessons[i].teachers ? lessons[i].teachers.join('+') : lessons[i].teacher,
          subject: lessons[i].subject,
          fromDay: lessons[i].day,
          fromPeriod: lessons[i].period,
          toDay: targetSlot.day,
          toPeriod: targetSlot.period
        });

        lessons[i].day = targetSlot.day;
        lessons[i].period = targetSlot.period;
        lessons[i].isSwapped = true;
        lessons[i].swapSlipId = recordId;
      }

      const record = {
        id: recordId,
        date: new Date().toLocaleDateString('zh-HK'),
        type: typeLabel,
        className: lessons[0].className,
        isCycleSwap: true,
        cycleCount: len,
        movements: movements,
        teachersSummary: lessons.map(l => l.teachers ? l.teachers.join('+') : l.teacher).join(' ➔ '),
        note: `本案為 ${typeLabel}，各科任課堂依閉環次序同步連調，已同時通過體育（最多2班）及電腦（最多1班）場地容量檢驗。`
      };

      swapHistory.unshift(record);
      finishSwapAction(record);
    }
